name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: assets/yarn.lock
      - run: yarn install --frozen-lockfile --network-timeout 1000000
      - run: yarn run build
      - name: Package assets.zip
        run: |
          cd ..
          mkdir -p dist-assets
          zip -r - assets/build > dist-assets/assets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assets-zip
          path: dist-assets/assets.zip
          if-no-files-found: error

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: assets-zip
          path: application/statics/
      - name: Verify embedded assets
        run: ls -la application/statics/ && test -s application/statics/assets.zip
      - name: Build
        run: CGO_ENABLED=0 go build -o cloudreve .
      - name: Test (excluding legacy broken packages)
        run: go test $(go list ./... | grep -v -E 'pkg/(conf|cache|request)$')
      - uses: actions/upload-artifact@v4
        with:
          name: cloudreve-binary
          path: cloudreve
          if-no-files-found: error

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          name: cloudreve-binary
          path: .
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            iwvw/cloudreve:latest
            iwvw/cloudreve:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
