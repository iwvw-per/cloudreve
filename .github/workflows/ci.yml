name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assets
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: assets/yarn.lock
      - run: yarn install --frozen-lockfile --network-timeout 1000000
      - run: yarn run build
      - name: Package assets.zip
        run: |
          cd ..
          mkdir -p dist-assets
          zip -r - assets/build > dist-assets/assets.zip
      - uses: actions/upload-artifact@v4
        with:
          name: assets-zip
          path: dist-assets/assets.zip
          if-no-files-found: error

  backend:
    name: Backend build & test
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: assets-zip
          path: application/statics/
      - name: Verify embedded assets
        run: ls -la application/statics/ && test -s application/statics/assets.zip
      - name: Build
        run: go build ./...
      - name: Test (excluding legacy broken packages)
        run: go test $(go list ./... | grep -v -E 'pkg/(conf|cache|request)$')
